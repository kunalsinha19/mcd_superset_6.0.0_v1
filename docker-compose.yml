# Reference compose file -- a starting point, not necessarily what your
# deployment team runs as-is (they likely already have their own
# orchestration matching the existing 4.1.3 setup). Service names
# (postgres, redis) match what superset_config.py's REDIS_HOST/
# SQLALCHEMY_DATABASE_URI defaults already expect.
#
# superset_config.py is NOT baked into the image -- mount your real one
# (with production secrets) at container start, per environment.

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset123
      POSTGRES_DB: superset
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  superset:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8088:8088"
    environment:
      # Optional one-time admin bootstrap -- only creates the user if it
      # doesn't already exist; harmless to leave set across restarts.
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:-}
    volumes:
      # The one file every environment must supply for itself -- never
      # baked into the image. See superset_config.py.example.
      - ./superset_config.py:/app/superset_config.py:ro

  superset-worker:
    build: .
    restart: unless-stopped
    depends_on:
      - superset
    command: celery --app superset.tasks.celery_app:app worker --pool=gevent --concurrency=4
    volumes:
      - ./superset_config.py:/app/superset_config.py:ro

  superset-beat:
    build: .
    restart: unless-stopped
    depends_on:
      - superset
    command: celery --app superset.tasks.celery_app:app beat --pidfile=
    volumes:
      - ./superset_config.py:/app/superset_config.py:ro

volumes:
  postgres_data:
  redis_data:
